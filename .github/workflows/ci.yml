name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core package and tests
        run: python -m pip install . "pytest>=7"
      - name: Core tests without optional PyTorch
        run: >-
          python -m pytest -p no:cacheprovider
          tests/test_config.py tests/test_packaging.py
          tests/test_no_absolute_paths.py tests/test_synthetic_fixture_integrity.py
          tests/test_windowing.py

  build-and-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: python -m pip install "build>=1.0" && python -m build
      - name: Install wheel from a foreign directory
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/lrf-imu-wheel"
          "$RUNNER_TEMP/lrf-imu-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/lrf-imu-wheel/bin/python" -c "import lrf_imu"
          "$RUNNER_TEMP/lrf-imu-wheel/bin/python" -m lrf_imu --help
          "$RUNNER_TEMP/lrf-imu-wheel/bin/lrf-imu" --help
