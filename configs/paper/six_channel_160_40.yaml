# Compatibility configuration for the separately trained six-channel model.
# Relative roots are resolved against the caller's base_dir/current directory.
# This is an evidence-labeled release default, not an exact paper reproduction.
name: lrf_imu_6ch_160_40

release:
  profile: compatibility_default
  exact_paper_reproduction: false
  note: >-
    This configuration records a portable compatibility choice from the
    observed wrapper/checkpoint evidence. Resolve the audit discrepancies
    before making an exact paper-reproduction claim.

data_root: data
output_root: outputs
checkpoint_root: checkpoints
results_root: results
device: auto
seed: 42

sensor:
  dataset: REALDISP
  placement: ideal
  name: right_thigh
  label_column: 119
  channel_indices: [80, 81, 82, 83, 84, 85]
  variant: six_channel
  training_mode: separate_model
  inference_policy: declared_channel_set_only
  allow_channel_drop: false

channels: [ax, ay, az, gx, gy, gz]
subjects: [1, 2, 3, 5, 8, 9, 10, 11, 12, 13, 14, 16]

activity_codes: [1, 3, 4, 33]
activity_mapping:
  0: {code: 1, name: walking}
  1: {code: 3, name: running}
  2: {code: 4, name: jump_up}
  3: {code: 33, name: cycling}

sampling_frequency_hz: 50
window:
  samples: 160
  hop: 40

normalization:
  method: zscore
  fit_on: training_subjects
  axes: [sample, time]
  apply_to_synthetic: true

split:
  protocol: leave_one_subject_out
  held_out_subject: null
  fold_id: null
  validation_fraction: 0.2

vae:
  input_channels: 6
  latent_dim_channels: 48
  latent_stride: 4
  latent_time_steps: 40
  deterministic_reconstruction_pass: true
  schedule_profile: observed_wrapper_compatibility
  training:
    batch_size: 256
    learning_rate: 0.001
    max_epochs: 1000
    early_stop_min_epochs: 200
    early_stop_patience: 100
    use_amp_bf16: true
    grad_clip: 1.0
    l2_weight: 0.5
    l1_weight: 0.1
    beta_schedule: {init: 0.08, min: 0.04, decay: 0.995}
    use_spectral_loss: false
    fft_weight: 0.0
    augmentation:
      enabled: true
      jitter: 0.008
      scale: 0.04
      time_mask: 0.05

flow:
  latent_dim_channels: 48
  latent_stride: 4
  base_width: 256
  width_profile: observed_wrapper_compatibility
  training:
    epochs: 300
    learning_rate: 0.0005
    early_stop_patience: 50
    grad_clip: 1.0
    optimizer: AdamW
    optimizer_betas: [0.9, 0.95]
    weight_decay: 0.0001
    batch_size: 128
    auto_batch: true
  architecture:
    channel_multipliers: [1, 2, 4]
    residual_block_kernel_short: 3
    residual_block_kernel_long: 31
    normalization_groups: 8
    squeeze_excitation_reduction: 4
    downsampling: avg_pool_factor_2
    upsampling: nearest_factor_2
    num_classes: 4

sampling:
  ode_solver: Euler
  steps: 10
  start_time: 1.0
  end_time: 0.0
  windows_per_class: 500
  seed: 42

classifiers:
  primary: random_forest
  random_forest:
    estimator: RandomForestClassifier
    n_estimators: 100
    random_state: 42
    n_jobs: 1
    input_representation: flattened_standardized_window
  cnn:
    conv_channels: [32, 64, 128]
    kernel_size: 5
    pool_kernel_size: 2
    fc_hidden: [256, 128]
    dropout: 0.3
    epochs: 80
    patience: 10
    batch_size: 64
    learning_rate: 0.001
    weight_decay: 0.0001
    validation_fraction: 0.2

sensitivity_grid:
  enabled: false
  window_samples: []
  hop_samples: []
  train_separately_per_setting: true

evidence:
  tiers:
    manuscript_reported: >-
      Values explicitly stated in the accepted-manuscript candidate or its
      supplementary material; some values conflict with observed runs.
    observed_wrapper: >-
      Values present in the audited training or evaluation wrappers used for
      the release evidence.
    observed_checkpoint_metadata: >-
      Values recorded in inspected checkpoint or run-summary metadata.
    release_default: >-
      Portable compatibility choice made for this public-release framework;
      not evidence of exact paper reproduction.
  defaults:
    roots: {tier: release_default}
    sensor_and_channels: {tier: observed_wrapper}
    subjects_and_loso: {tier: manuscript_reported}
    window_and_hop: {tier: manuscript_reported}
    normalization: {tier: manuscript_reported}
    seed: {tier: manuscript_reported}
    vae.training.batch_size: {tier: observed_checkpoint_metadata}
    vae.training.loss_and_beta_schedule: {tier: observed_wrapper}
    flow.base_width: {tier: observed_wrapper}
    flow.training.batch_size: {tier: observed_wrapper}
    sampling: {tier: observed_wrapper}
    classifiers: {tier: observed_wrapper}
  conflicts:
    vae_schedule:
      status: unresolved
      manuscript_reported:
        l2_weight: 1.0
        l1_weight: 0.1
        beta_init: 0.005
        beta_min: 0.00001
        beta_decay: 0.7
      observed_wrapper:
        l2_weight: 0.5
        l1_weight: 0.1
        beta_init: 0.08
        beta_min: 0.04
        beta_decay: 0.995
      observed_checkpoint_metadata:
        batch_size: 256
      release_default:
        selected_profile: observed_wrapper_compatibility
        exact_reproduction_claim: false
    flow_base_width:
      status: unresolved
      manuscript_reported: {base_width: 128}
      observed_wrapper: {base_width: 256}
      observed_checkpoint_metadata: {subject_01_model_ch: 256}
      release_default:
        selected_profile: observed_wrapper_compatibility
        exact_reproduction_claim: false
