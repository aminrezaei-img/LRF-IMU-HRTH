[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "lrf-imu"
version = "0.1.0"
description = "Portable configuration, data preparation, VAE, and path framework for the LRF-IMU public release"
requires-python = ">=3.7"
dependencies = ["PyYAML", "numpy>=1.20"]

[project.scripts]
lrf-imu = "lrf_imu.cli:main"

[project.optional-dependencies]
test = ["pytest"]
training = ["torch"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lrf_imu = ["resources/configs/paper/*.yaml"]
