[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "lrf-imu"
version = "0.1.0"
description = "Portable configuration and path framework for the LRF-IMU public release"
requires-python = ">=3.7"
dependencies = ["PyYAML"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
